.common.relatedLabel\":\"相关\",\"legal.common.supportEmailLink\":\"\u003csupportEmail\u003esupport@today.ai\u003c/supportEmail\u003e\",\"legal.common.privacyEmailLink\":\"\u003cprivacyEmail\u003eprivacy@today.ai\u003c/privacyEmail\u003e\",\"legal.common.legalEmailLink\":\"\u003clegalEmail\u003elegal@today.ai\u003c/legalEmail\u003e\",\"legal.common.securityEmailLink\":\"\u003csecurityEmail\u003esecurity@today.ai\u003c/securityEmail\u003e\",\"legal.common.privacyPolicyLink\":\"\u003cprivacyLink\u003e隐私政策\u003c/privacyLink\u003e\",\"legal.common.termsLink\":\"\u003ctermsLink\u003e服务条款\u003c/termsLink\u003e\",\"legal.support.meta.title\":\"支持 — Today\",\"legal.support.meta.description\":\"获取 Today 帮助：联系支持团队、查看常见问题，或了解如何分享反馈。\",\"legal.support.title\":\"支持\",\"legal.support.intro\":\"需要 \u003cstrong\u003eToday\u003c/strong\u003e 的帮助？我们随时为你提供支持。你可以联系支持团队，查看下方常见问题，或告诉我们哪里可以做得更好。\",\"legal.support.contact.title\":\"1. 联系我们\",\"legal.support.contact.body\":\"联系真人支持最快的方式是发送邮件。请告诉我们你原本想做什么、发生了什么，以及（如果可以）你使用的设备和应用版本。我们通常会在一个工作日内回复。\",\"legal.support.contact.general\":\"\u003cstrong\u003e一般支持\u003c/strong\u003e — \u003csupportEmail\u003esupport@today.ai\u003c/supportEmail\u003e\",\"legal.support.contact.privacy\":\"\u003cstrong\u003e隐私问题\u003c/strong\u003e — \u003cprivacyEmail\u003eprivacy@today.ai\u003c/privacyEmail\u003e\",\"legal.support.contact.legal\":\"\u003cstrong\u003e法律与条款\u003c/strong\u003e — \u003clegalEmail\u003elegal@today.ai\u003c/legalEmail\u003e\",\"legal.support.questions.title\":\"2. 常见问题\",\"legal.support.questions.account.title\":\"如何创建账号？\",\"legal.support.questions.account.body\":\"打开 Today 应用，或访问 \u003cloginLink\u003etoday.ai/login\u003c/loginLink\u003e，使用邮箱或支持的单点登录提供方登录。新账号首次登录时会进入一个简短的引导流程。\",\"legal.support.questions.password.title\":\"我忘记密码了，该怎么办？\",\"legal.support.questions.password.body\":\"在登录页面使用 \u003cforgotPasswordLink\u003e忘记密码\u003c/forgotPasswordLink\u003e。你会在账号绑定邮箱收到重置链接。如果几分钟内没有收到，请先检查垃圾邮件，然后写信给 \u003csupportEmail\u003esupport@today.ai\u003c/supportEmail\u003e。\",\"legal.support.questions.delete.title\":\"如何删除我的账号或数据？\",\"legal.support.questions.delete.body\":\"你可以随时从账号绑定邮箱发送邮件至 \u003cprivacyEmail\u003eprivacy@today.ai\u003c/privacyEmail\u003e，请求删除账号和数据。关于数据保留和你的权利，请查看\u003cprivacyLink\u003e隐私政策\u003c/privacyLink\u003e。\",\"legal.support.questions.platforms.title\":\"Today 支持哪些平台？\",\"legal.support.questions.platforms.body\":\"Today 目前支持 iOS 和 macOS，并在 \u003ctodayLink\u003etoday.ai\u003c/todayLink\u003e 提供 Web 体验。其他平台正在积极开发中。\",\"legal.support.questions.feedback.title\":\"我发现了问题，或有功能建议。\",\"legal.support.questions.feedback.body\":\"请告诉我们：见下方反馈部分。具体的复现步骤和截图能帮助我们更快修复问题。\",\"legal.support.feedback.title\":\"3. 反馈\",\"legal.support.feedback.body\":\"每一条消息我们都会阅读。如需发送反馈、问题报告或功能建议：\",\"legal.support.feedback.email\":\"发送邮件至 \u003csupportEmail\u003esupport@today.ai\u003c/supportEmail\u003e，主题写为 \u003cstrong\u003eFeedback\u003c/strong\u003e；或\",\"legal.support.feedback.inApp\":\"使用应用内 \u003cstrong\u003eSettings → Help \u0026 Feedback\u003c/strong\u003e 里的反馈选项，它会附带诊断上下文，帮助我们更快分流处理。\",\"legal.support.responseTimes.title\":\"4. 回复时间\",\"legal.support.responseTimes.body\":\"我们的支持时间为周一至周五。大多数咨询会在一个工作日内得到回复。涉及安全的报告会优先处理；请发送邮件至 \u003csecurityEmail\u003esecurity@today.ai\u003c/securityEmail\u003e，我们会尽快回复。\",\"legal.privacy.meta.title\":\"隐私政策 — Today\",\"legal.privacy.title\":\"隐私政策\",\"legal.privacy.intro\":\"本隐私政策（\u003cstrong\u003e“政策”\u003c/strong\u003e）说明 \u003cstrong\u003eToday\u003c/strong\u003e（\u003cstrong\u003e“我们”\u003c/strong\u003e）在你使用我们的网站、应用程序及相关服务（统称为\u003cstrong\u003e“服务”\u003c/strong\u003e）时，如何收集、使用和共享与你有关的信息。\",\"legal.privacy.effectiveDateLabel\":\"生效日期\",\"legal.privacy.effectiveDateValue\":\"2026年5月13日\",\"legal.privacy.lastUpdatedLabel\":\"最后更新\",\"legal.privacy.lastUpdatedValue\":\"2026年8月31日\",\"legal.privacy.collection.title\":\"1. 我们收集的信息\",\"legal.privacy.collection.intro\":\"我们可能会收集以下类别的信息：\",\"legal.privacy.collection.account\":\"\u003cstrong\u003e账号信息\u003c/strong\u003e — 姓名、电子邮箱地址和身份验证凭据（包括第三方登录令牌）。\",\"legal.privacy.collection.userContent\":\"\u003cstrong\u003e用户内容\u003c/strong\u003e — 你提交至服务或通过服务生成的文本、文件、消息、语音录音及其他数据，包括第 \u003cstrong\u003e1C\u003c/strong\u003e 节所述由第三方 AI 提供方处理的内容。\",\"legal.privacy.collection.usageData\":\"\u003cstrong\u003e使用数据\u003c/strong\u003e — 设备标识符（包括 Android ID；在您同意隐私政策后可能通过系统接口获取，用于设备识别和安全运行）、浏览器类型、操作系统、IP 地址、来源 URL、访问页面和功能交互。\",\"legal.privacy.collection.connectedAccount\":\"\u003cstrong\u003e已连接账号数据\u003c/strong\u003e — 你通过启用的集成授权第三方服务与我们共享的信息。\",\"legal.privacy.collection.payment\":\"\u003cstrong\u003e付款信息\u003c/strong\u003e — 由我们的支付处理方处理；我们不会存储完整银行卡号。\",\"legal.privacy.collection.healthFitness\":\"\u003cstrong\u003e健康与健身数据\u003c/strong\u003e — 在 Android 上，当你启用 Health Connect 时；在 iOS / iPadOS 上，当你授权 Apple HealthKit 类别时。关于数据类别、我们如何使用这些数据以及如何撤销访问权限，请参见下方第 \u003cstrong\u003e1A 和 1B\u003c/strong\u003e 节。\",\"legal.privacy.healthConnect.title\":\"1A. 健康与健身数据（Android — Health Connect）\",\"legal.privacy.healthConnect.body\":\"Today Android 应用集成了 \u003cstrong\u003eAndroid Health Connect\u003c/strong\u003e。我们只会在你明确授权后读取健康数据，并且只读取下列类别；我们不会向 Health Connect 写回数据。你可以随时在 \u003cstrong\u003eAndroid 设置 → Health Connect → 应用权限 → Today\u003c/strong\u003e 中撤销访问权限。\",\"legal.privacy.healthConnect.activity\":\"\u003cstrong\u003e活动\u003c/strong\u003e — 步数、运动记录、睡眠记录。\",\"legal.privacy.healthConnect.vitals\":\"\u003cstrong\u003e生命体征\u003c/strong\u003e — 心率、血压、血糖、血氧饱和度、呼吸频率、体温。\",\"legal.privacy.healthConnect.bodyMeasurements\":\"\u003cstrong\u003e身体测量\u003c/strong\u003e — 体重。\",\"legal.privacy.healthConnect.nutrition\":\"\u003cstrong\u003e营养与饮水\u003c/strong\u003e — 营养记录和饮水摄入。\",\"legal.privacy.healthConnect.assistantUse\":\"Today AI 助手会按需读取这些数据，以回答你的问题或执行你请求的任务。读数会由我们的 AI 推理和云服务提供方依据书面保密和数据保护义务进行处理，并可能作为聊天或智能体任务历史的一部分存储；你可以随时查看和删除这些历史。另请参见第 \u003cstrong\u003e1C\u003c/strong\u003e 节。\",\"legal.privacy.healthConnect.neverUse\":\"\u003cstrong\u003e我们绝不会\u003c/strong\u003e将 Health Connect 数据或由其衍生的数据用于广告、营销或再营销；不会出售或转让给数据经纪商、广告网络或任何其他方用于广告目的；也不会将其用于信用、保险、就业或类似资格决定。Health Connect 数据在传输和静态存储时均会加密，我们不会有意读取 18 岁以下用户的数据。\",\"legal.privacy.healthKit.title\":\"1B. 健康与健身数据（iOS / iPadOS — Apple HealthKit）\",\"legal.privacy.healthKit.body\":\"Today iOS 和 iPadOS 应用与 \u003cstrong\u003eApple HealthKit\u003c/strong\u003e 集成。我们只会读取你在 HealthKit 权限弹窗中明确授权的类别，不会向「健康」App 写入数据。在你允许的情况下，我们还会使用 HealthKit 的后台交付能力，以便新的读数无需你打开应用即可同步到 Today。你可以随时在 \u003cstrong\u003eiOS 设置 → 隐私与安全性 → 健康 → Today\u003c/strong\u003e 中更改或撤销任一类别；撤销后，我们将停止继续收集该类数据。\",\"legal.privacy.healthKit.categoriesIntro\":\"在你授予权限的前提下，Today 会读取以下 HealthKit 类别：\",\"legal.privacy.healthKit.activity\":\"\u003cstrong\u003e活动、健身与锻炼\u003c/strong\u003e — 步数、距离、爬楼层数，锻炼、活动与站立时长，活动消耗和静息消耗能量，每日活动摘要，跑步、骑行、游泳及其他运动的锻炼记录和相关表现指标，以及锻炼时记录的 \u003cstrong\u003eGPS 路线\u003c/strong\u003e。\",\"legal.privacy.healthKit.heartBlood\":\"\u003cstrong\u003e心脏与血液\u003c/strong\u003e — 心率、静息心率和步行心率、心率变异性、心率恢复、最大摄氧量、心电图（ECG）及心跳间期序列、外周灌注指数、血压、血糖、心房颤动负荷、血液酒精浓度，以及心律不齐、高低心率、高血压和心肺适能偏低等事件。\",\"legal.privacy.healthKit.bodyMeasurements\":\"\u003cstrong\u003e身体测量与代谢\u003c/strong\u003e — 体重、体脂率、身体质量指数、去脂体重、身高、腰围、体温和基础体温、睡眠腕部温度、基础消耗能量，以及皮肤电活动。\",\"legal.privacy.healthKit.respiratorySleep\":\"\u003cstrong\u003e呼吸、睡眠与正念\u003c/strong\u003e — 呼吸频率、血氧饱和度、肺功能指标、吸入器使用、睡眠记录和睡眠阶段、睡眠呼吸暂停与呼吸紊乱事件、正念练习。\",\"legal.privacy.healthKit.nutrition\":\"\u003cstrong\u003e营养与饮水\u003c/strong\u003e — 热量、宏量营养素、维生素、矿物质、咖啡因、饮水摄入、酒精摄入。\",\"legal.privacy.healthKit.mobility\":\"\u003cstrong\u003e行动能力、步态与听力\u003c/strong\u003e — 步行速度、步行稳定性、步行不对称性和步幅、上下楼速度、六分钟步行测试、环境和耳机音量暴露、环境降噪，以及听力测试结果（听力图）。\",\"legal.privacy.healthKit.reproductive\":\"\u003cstrong\u003e生殖与月经健康\u003c/strong\u003e — 经期流量和周期事件、排卵和妊娠测试、怀孕与哺乳状态、性行为、避孕措施。\",\"legal.privacy.healthKit.mentalHealth\":\"\u003cstrong\u003e心理健康\u003c/strong\u003e — 心理状态记录（即时与每日情绪），以及你在「健康」App 中完成的焦虑（GAD-7）和抑郁（PHQ-9）评估结果。\",\"legal.privacy.healthKit.symptoms\":\"\u003cstrong\u003e症状与生活方式\u003c/strong\u003e — 你自行记录的症状（如头痛、疲劳、情绪变化）、日光和紫外线暴露、跌倒、胰岛素输注、酒精饮品数量，以及洗手和刷牙事件。\",\"legal.privacy.healthKit.profile\":\"\u003cstrong\u003e健康档案\u003c/strong\u003e — 你在「健康」App 中填写的固定信息：出生日期、生理性别、血型、肤质、轮椅使用状态和活动移动模式。\",\"legal.privacy.healthKit.recordContext\":\"\u003cstrong\u003e记录上下文\u003c/strong\u003e — 记录标识符、时间戳和时区，以及产生该读数的来源应用和设备名称。\",\"legal.privacy.healthKit.assistantUse\":\"连接 HealthKit 后，Today 会通过加密连接将你授权的数据（包括单条记录、每小时汇总数据和健康档案快照）同步到 Today 的云服务。同步可能发生在首次连接时、HealthKit 在后台交付新样本时、你打开或返回应用时、计划中的后台同步期间、我们的服务端需要最新数据为你准备内容时（例如生成早报或回答健康问题），以及你手动请求同步时。我们会将同步的数据作为你 Today 账号的一部分存储，并用于展示健康数据面板和数据来源、提供个性化总结和健康洞察，以及回答你的问题或执行你请求的任务。我们的 AI 推理和云服务提供方可能会代表我们，依据书面保密和数据保护义务处理这些数据。撤销 HealthKit 访问权限不会删除已同步到 Today 的数据；你可以按照第 \u003cstrong\u003e6\u003c/strong\u003e 节的说明，发送邮件至 \u003cprivacyEmail\u003eprivacy@today.ai\u003c/privacyEmail\u003e，请求删除已同步的数据或你的账号。完成账号删除请求后，除非法律要求保留，我们会在合理时间内删除相关同步数据或对其进行匿名化。另请参见第 \u003cstrong\u003e1C\u003c/strong\u003e 节。\",\"legal.privacy.healthKit.neverUse\":\"\u003cstrong\u003e我们绝不会\u003c/strong\u003e将 HealthKit 数据或由其衍生的数据用于广告、营销或再营销；不会出售或转让给数据经纪商、广告网络或任何其他方用于广告目的；也不会将其用于信用、保险、就业或类似资格决定。HealthKit 数据在传输和静态存储时均会加密，我们不会有意读取 18 岁以下用户的数据。\",\"legal.privacy.aiProviders.title\":\"1C. AI 功能和第三方模型提供方\",\"legal.privacy.aiProviders.body\":\"当你使用服务中的 AI 功能（包括聊天、语音消息、自动化、任务，以及个性化总结或健康洞察）时，我们会在 Today 系统中处理生成回复所需的信息。我们也可能使用\u003cstrong\u003e第三方人工智能和云推理提供方\u003c/strong\u003e（\u003cstrong\u003e“AI 提供方”\u003c/strong\u003e），由其\u003cstrong\u003e代表我们\u003c/strong\u003e处理个人信息以运行这些功能。根据产品配置和地区，AI 提供方可能包括 \u003cstrong\u003eAmazon Web Services\u003c/strong\u003e、\u003cstrong\u003eAnthropic\u003c/strong\u003e、\u003cstrong\u003eOpenAI\u003c/strong\u003e 等公司，以及我们不时在网站列出的其他分处理方。\",\"legal.privacy.aiProviders.categoriesIntro\":\"\u003cstrong\u003e我们可能发送给 AI 提供方的信息类别\u003c/strong\u003e包括：\",\"legal.privacy.aiProviders.messages\":\"你提交的\u003cstrong\u003e消息和提示\u003c/strong\u003e，以及返回给你的 \u003cstrong\u003eAI 生成输出\u003c/strong\u003e；\",\"legal.privacy.aiProviders.attachments\":\"你选择发送的\u003cstrong\u003e附件\u003c/strong\u003e（例如图片、文档、音频或语音录音）；\",\"legal.privacy.aiProviders.context\":\"你为特定请求授权的\u003cstrong\u003e上下文\u003c/strong\u003e，包括你启用的\u003cstrong\u003e已连接第三方集成\u003c/strong\u003e中的数据，以及在允许的情况下，第 \u003cstrong\u003e1A 和 1B\u003c/strong\u003e 节所述的 \u003cstrong\u003eHealth Connect\u003c/strong\u003e 或 \u003cstrong\u003eHealthKit\u003c/strong\u003e 数据；\",\"legal.privacy.aiProviders.metadata\":\"运行功能所合理需要的\u003cstrong\u003e账号和会话元数据\u003c/strong\u003e（例如用户标识符、时间戳、功能开关和安全信号）。除非你联系支持且我们需要相关信息来调查具体问题，我们\u003cstrong\u003e不会\u003c/strong\u003e在常规错误日志中包含消息正文。\",\"legal.privacy.aiProviders.use\":\"\u003cstrong\u003e我们如何使用这些信息：\u003c/strong\u003e仅用于\u003cstrong\u003e提供、运行、保护和改进\u003c/strong\u003e你请求的 AI 功能；用于\u003cstrong\u003e防范欺诈和滥用\u003c/strong\u003e；以及\u003cstrong\u003e遵守法律\u003c/strong\u003e。我们要求 AI 提供方在\u003cstrong\u003e书面保密和数据处理义务\u003c/strong\u003e下处理个人信息，且保护程度\u003cstrong\u003e不低于\u003c/strong\u003e本政策。\",\"legal.privacy.aiProviders.training\":\"\u003cstrong\u003e模型训练：\u003c/strong\u003e我们\u003cstrong\u003e不允许\u003c/strong\u003e AI 提供方使用你的\u003cstrong\u003e可识别\u003c/strong\u003e聊天内容、附件或健康数据来\u003cstrong\u003e训练其公开基础模型\u003c/strong\u003e。在法律允许的情况下，我们可能使用\u003cstrong\u003e汇总或去标识化\u003c/strong\u003e信息来提升服务的可靠性和安全性。\",\"legal.privacy.aiProviders.retention\":\"\u003cstrong\u003e保留与控制：\u003c/strong\u003eAI 相关内容会作为你的\u003cstrong\u003e账号历史\u003c/strong\u003e（例如聊天或智能体任务历史）的一部分存储，你可以在服务中\u003cstrong\u003e查看和删除\u003c/strong\u003e，但须遵守第 \u003cstrong\u003e5\u003c/strong\u003e 节。你删除内容或账号后，除非法律要求保留，我们会在合理时间内删除相关数据或对其进行匿名化。\",\"legal.privacy.aiProviders.choice\":\"\u003cstrong\u003e你的选择：\u003c/strong\u003e某些 AI 功能需要向 AI 提供方发送个人信息。在我们依赖\u003cstrong\u003e同意\u003c/strong\u003e的情况下，你可以按照第 \u003cstrong\u003e6\u003c/strong\u003e 节说明\u003cstrong\u003e拒绝或撤回\u003c/strong\u003e同意。如果你拒绝，仍可使用服务中的非 AI 部分，但 \u003cstrong\u003eAI 功能可能无法工作\u003c/strong\u003e。在适用法律要求的情况下，我们也会在你发送第一条 AI 消息前提供\u003cstrong\u003e应用内披露\u003c/strong\u003e。\",\"legal.privacy.use.title\":\"2. 我们如何使用信息\",\"legal.privacy.use.intro\":\"我们使用收集的信息来：\",\"legal.privacy.use.provide\":\"提供、维护和改进服务；\",\"legal.privacy.use.authenticate\":\"验证用户身份并保护账号安全；\",\"legal.privacy.use.transactions\":\"处理交易并发送相关信息（收据、确认信息）；\",\"legal.privacy.use.announcements\":\"发送服务公告并回应支持请求；\",\"legal.privacy.use.aiFeatures\":\"运行、保护和改进你使用的 \u003cstrong\u003eAI 功能\u003c/strong\u003e，包括按照第 \u003cstrong\u003e1C\u003c/strong\u003e 节所述，通过\u003cstrong\u003e代表我们处理的 AI 提供方\u003c/strong\u003e处理你的内容，并在法律允许的情况下使用\u003cstrong\u003e汇总或去标识化\u003c/strong\u003e数据改进服务；\",\"legal.privacy.use.security\":\"发现欺诈、滥用和安全事件；以及\",\"legal.privacy.use.legal\":\"履行法律义务。\",\"legal.privacy.sharing.title\":\"3. 我们如何共享信息\",\"legal.privacy.sharing.intro\":\"我们可能会与以下对象共享信息：\",\"legal.privacy.sharing.aiProviders\":\"\u003cstrong\u003eAI 和推理提供方\u003c/strong\u003e — 代表我们托管、路由或运行 AI 模型的公司，用于生成回复并完成你请求的任务，如第 \u003cstrong\u003e1C\u003c/strong\u003e 节所述，并受保密和数据保护义务约束；\",\"legal.privacy.sharing.serviceProviders\":\"\u003cstrong\u003e服务提供方\u003c/strong\u003e — 协助托管、分析、支付处理、客户支持和类似运营的公司，\u003cstrong\u003e不包括第 1C 节所述的 AI 处理\u003c/strong\u003e，并受保密义务约束；\",\"legal.privacy.sharing.integrations\":\"你连接或授权的\u003cstrong\u003e第三方集成\u003c/strong\u003e；\",\"legal.privacy.sharing.affiliates\":\"发生合并、收购或资产出售时的\u003cstrong\u003e关联方和继承方\u003c/strong\u003e；以及\",\"legal.privacy.sharing.lawEnforcement\":\"法律、法院命令要求，或为保护权利和安全而需要时的\u003cstrong\u003e执法机关或监管机构\u003c/strong\u003e。\",\"legal.privacy.sharing.noSell\":\"我们\u003cstrong\u003e不会出售\u003c/strong\u003e你的个人信息。\",\"legal.privacy.sharing.noShareAds\":\"我们\u003cstrong\u003e不会出售\u003c/strong\u003e或\u003cstrong\u003e共享\u003c/strong\u003e适用美国州隐私法定义下用于\u003cstrong\u003e跨情境行为广告\u003c/strong\u003e的个人信息。\",\"legal.privacy.cookies.title\":\"4. Cookie 和类似技术\",\"legal.privacy.cookies.body\":\"我们使用 Cookie、本地存储和类似技术进行身份验证、偏好设置和分析。你可以通过浏览器设置控制 Cookie；但是，如果禁用 Cookie，某些功能可能无法正常运行。\",\"legal.privacy.retention.title\":\"5. 数据保留\",\"legal.privacy.retention.body\":\"只要你的账号处于活跃状态，或为提供服务、履行法律义务、解决争议和执行协议所需，我们会保留信息。为 \u003cstrong\u003eAI 功能\u003c/strong\u003e（第 \u003cstrong\u003e1C\u003c/strong\u003e 节）处理的内容，会按照与你的\u003cstrong\u003e账号和聊天历史\u003c/strong\u003e相同的规则保留，除非法律或你的删除请求要求更短期限。当数据不再需要时，我们会在合理时间内删除或匿名化。\",\"legal.privacy.accountDeletion.title\":\"6A. 账号删除\",\"legal.privacy.accountDeletion.instructions\":\"你可以随时在 Today 应用中前往\u003cstrong\u003e设置 → 删除账号\u003c/strong\u003e并确认，删除你的账号。\",\"legal.privacy.accountDeletion.consequences\":\"账号删除完成后，你的账号及所有关联数据（包括聊天历史、记忆、任务以及从已连接应用同步的数据）将从 Today 的系统中永久删除，不再存储于 Today 云端。账号删除是永久性的，无法撤销。\",\"legal.privacy.accountDeletion.connectedApps\":\"删除 Today 账号会移除 Today 存储的同步副本，但不会删除你在已连接的第三方应用中的账号或原始数据。\",\"legal.privacy.accountDeletion.help\":\"如果你需要账号删除方面的帮助，请联系 \u003cprivacyEmail\u003eprivacy@today.ai\u003c/privacyEmail\u003e。\",\"legal.privacy.rights.title\":\"6. 你的权利和选择\",\"legal.privacy.rights.body\":\"根据你所在的司法辖区，你可能对个人信息拥有以下部分或全部权利：\",\"legal.privacy.rights.access\":\"\u003cstrong\u003e访问和可携带性\u003c/strong\u003e — 请求以结构化格式获取你的数据副本；\",\"legal.privacy.rights.correction\":\"\u003cstrong\u003e更正\u003c/strong\u003e — 请求更正不准确的数据；\",\"legal.privacy.rights.deletion\":\"\u003cstrong\u003e删除\u003c/strong\u003e — 请求删除你的数据，但须遵守保留义务；\",\"legal.privacy.rights.restriction\":\"\u003cstrong\u003e限制和反对\u003c/strong\u003e — 限制或反对某些处理活动；\",\"legal.privacy.rights.withdrawConsent\":\"\u003cstrong\u003e撤回同意\u003c/strong\u003e — 在处理基于同意时，随时撤回同意；以及\",\"legal.privacy.rights.aiDataSharing\":\"\u003cstrong\u003eAI 数据共享\u003c/strong\u003e — 当我们依赖你的\u003cstrong\u003e同意\u003c/strong\u003e向 \u003cstrong\u003eAI 提供方\u003c/strong\u003e（第 \u003cstrong\u003e1C\u003c/strong\u003e 节）发送个人信息时，你可以随时在应用内（\u003cstrong\u003eSettings → Privacy Policy\u003c/strong\u003e，以及首次发送 AI 消息前的应用内提示）或发送邮件至 \u003cprivacyEmail\u003eprivacy@today.ai\u003c/privacyEmail\u003e 撤回同意。撤回同意可能限制或停用 AI 功能，但不会影响基于其他法律依据（例如安全或法律合规）的处理。\",\"legal.privacy.rights.exercise\":\"如需行使这些权利，请通过 \u003cprivacyEmail\u003eprivacy@today.ai\u003c/privacyEmail\u003e 联系我们。我们会在适用法律要求的期限内回复。\",\"legal.privacy.transfers.title\":\"7. 国际数据传输\",\"legal.privacy.transfers.body\":\"我们在全球范围内运营。你的信息可能会被传输至你所在国家/地区以外并在那里处理，包括由第 \u003cstrong\u003e1C\u003c/strong\u003e 节所述的 \u003cstrong\u003eAI 提供方\u003c/strong\u003e处理。在法律要求的情况下，我们会实施适当保障措施（例如标准合同条款或等效机制）。\",\"legal.privacy.security.title\":\"8. 安全\",\"legal.privacy.security.body\":\"我们采用管理、技术和物理保障措施来保护你的信息。没有任何传输或存储方法是完全安全的；我们无法保证绝对安全，但如果发生数据泄露，我们会按照法律要求通知你。\",\"legal.privacy.children.title\":\"9. 儿童\",\"legal.privacy.children.body\":\"服务并非面向 18 岁以下儿童（或你所在司法辖区适用的数字同意年龄以下儿童）。我们不会有意收集儿童的个人信息。如果你认为儿童向我们提供了数据，请联系我们，以便我们删除。\",\"legal.privacy.changes.title\":\"10. 变更\",\"legal.privacy.changes.body\":\"我们可能会不时更新本政策。我们会发布更新后的政策并更新生效日期。如果变更具有重大影响，我们会按照法律要求提供额外通知。\",\"legal.privacy.contact.title\":\"11. 联系\",\"legal.terms.meta.title\":\"服务条款 — Today\",\"legal.terms.title\":\"服务条款\",\"legal.terms.intro\":\"本服务条款（\u003cstrong\u003e“条款”\u003c/strong\u003e）规范你对 \u003cstrong\u003eToday\u003c/strong\u003e（\u003cstrong\u003e“我们”\u003c/strong\u003e）的使用。\",\"legal.terms.effectiveDateLabel\":\"生效日期\",\"legal.terms.effectiveDateValue\":\"2026年9月7日\",\"legal.terms.acceptance\":\"访问或使用我们的网站、应用程序及相关服务（统称为\u003cstrong\u003e“服务”\u003c/strong\u003e），即表示你同意本条款。如果你不同意，请勿使用服务。\",\"legal.terms.eligibility.title\":\"1. 资格\",\"legal.terms.eligibility.body\":\"你必须能够在你的司法辖区内订立具有约束力的合同，并满足任何最低年龄要求（通常至少 18 岁，或你所在地区的数字同意年龄，以较高者为准）。如果你代表某个组织使用服务，你声明你有权约束该组织。\",\"legal.terms.accounts.title\":\"2. 账号和安全\",\"legal.terms.accounts.body\":\"你可能需要账号才能访问某些功能。你有责任保护自己的凭据，并对账号下的活动负责。如发现任何未经授权的使用，请及时通知我们。\",\"legal.terms.services.title\":\"3. 服务\",\"legal.terms.services.body\":\"Today 提供软件和在线服务，可能包括 AI 辅助功能、自动化、与第三方产品的集成及相关功能。在可行情况下，我们会提供合理通知后修改、暂停或停止服务的部分内容。\",\"legal.terms.beta.title\":\"4. 服务可用性与更新\",\"legal.terms.beta.body\":\"服务通过 Today 当前提供的计划和平台提供。功能、使用额度、AI 模型、集成和设备能力可能因你的计划、账户、设备、操作系统、地区、产品版本、分发渠道和推出状态而异。\",\"legal.terms.beta.body2\":\"我们可能新增、修改、暂停或停止部分功能或服务。我们也可能要求你安装更新（包括强制更新）作为继续使用的条件。旧版本应用可能停止运行或功能受限。在切实可行的情况下，我们会就服务的重大变更提供合理通知。\",\"legal.terms.thirdParty.title\":\"5. 第三方服务和集成\",\"legal.terms.thirdParty.body\":\"服务可能会与你选择连接的第三方平台、API 或账号互操作。你对这些第三方的使用受其条款和隐私政策约束。我们不对第三方服务或你启用的集成所采取的操作负责。\",\"legal.terms.content.title\":\"6. 你的内容\",\"legal.terms.content.body1\":\"你保留对所提交内容（\u003cstrong\u003e“用户内容”\u003c/strong\u003e）的权利。为运行服务，你授予我们一项非独占、全球范围的许可，使我们仅在提供、保护、改进和支持服务所需范围内托管、处理、传输、展示用户内容并创作其衍生作品，并按照我们的隐私政策进行处理。\",\"legal.terms.content.body2\":\"你对自己的用户内容负责，并声明你拥有授予上述许可所需的权利。请勿提交违法内容或侵犯他人权利的内容。\",\"legal.terms.aiOutputs.title\":\"7. AI 输出和限制\",\"legal.terms.aiOutputs.body\":\"通过服务生成的输出可能不准确、不完整，或不适合特定目的。你不应将输出作为可能造成伤害的决策的唯一依据。服务不能替代专业建议（例如医疗、法律或财务建议）。你有责任评估输出并决定如何使用。\",\"legal.terms.acceptableUse.title\":\"8. 可接受使用\",\"legal.terms.acceptableUse.intro\":\"你同意不会：\",\"legal.terms.acceptableUse.law\":\"违反适用法律或第三方权利；\",\"legal.terms.acceptableUse.vulnerability\":\"未经授权试探、扫描或测试服务漏洞；\",\"legal.terms.acceptableUse.interfere\":\"干扰或破坏服务或他人的使用；\",\"legal.terms.acceptableUse.reverseEngineer\":\"反向工程、反编译或试图提取源代码，但法律禁止限制的情况除外；\",\"legal.terms.acceptableUse.competing\":\"未经我们书面许可，通过抓取或批量提取训练数据，使用服务开发竞争模型或服务；\",\"legal.terms.acceptableUse.spam\":\"发送垃圾信息、恶意软件，或从事欺诈活动；或\",\"legal.terms.acceptableUse.circumvent\":\"规避使用限制、访问控制或计费机制。\",\"legal.terms.acceptableUse.enforcement\":\"我们可能调查违规行为并采取措施，包括暂停或终止服务。\",\"legal.terms.fees.title\":\"9. 计划、试用、费用与计费\",\"legal.terms.fees.body\":\"Today 目前提供 Free、Pro 和 Ultra 计划。可用功能、使用额度、AI 模型和其他计划权益会在服务中展示，并可能因账户、平台、地区、产品版本和购买渠道而异。\",\"legal.terms.fees.body2\":\"Pro 和 Ultra 是按月付费的订阅计划。在你授权购买前，我们会展示价格、适用税费、计费周期、试用条款和应付总额。价格可能因地区、货币、税费、应用商店定价、此前的订阅状态和推出配置而异。\",\"legal.terms.fees.body3\":\"符合条件的账户可能获得 7 天 Pro 试用。试用是否可用及资格要求取决于你的账户历史、平台、产品版本、购买渠道以及提供试用时生效的规则。Ultra 目前不提供免费试用。在你开始试用前，我们会披露试用结束后适用的续订价格和计费日期。\",\"legal.terms.fees.body4\":\"周期性订阅会在每个计费周期结束时自动续订，除非你在适用的续订日期前取消。你必须通过最初购买订阅的平台或购买渠道管理或取消订阅。删除应用、删除 Today 账户或退出登录不会自动取消订阅。\",\"legal.terms.fees.body5\":\"除非购买时另有说明，费用不可退款，但适用法律要求退款的除外。我们可能在依法提供通知后变更价格或计划权益。任何价格变更最早于你的下一个适用续订周期生效，除非你明确同意其他安排。\",\"legal.terms.ip.title\":\"10. 知识产权\",\"legal.terms.ip.body\":\"我们和我们的许可方拥有服务，包括软件、品牌和文档，但受本条款明确授予的许可约束。除这些许可外，不会通过默示方式授予任何权利。\",\"legal.terms.confidentiality.title\":\"11. 保密和反馈\",\"legal.terms.confidentiality.body\":\"如果我们提供标记为保密的非公开信息，你只能按许可方式使用。如果你选择向我们发送反馈或建议，我们可以使用这些反馈或建议，而无需对你承担义务。\",\"legal.terms.warranties.title\":\"12. 免责声明\",\"legal.terms.warranties.body\":\"服务按“现状”和“可用”提供。在法律允许的最大范围内，我们否认所有明示、默示或法定保证，包括适销性、特定用途适用性和非侵权保证。我们不保证服务不会中断或没有错误。\",\"legal.terms.liability.title\":\"13. 责任限制\",\"legal.terms.liability.body1\":\"在法律允许的最大范围内，对于因本条款或服务引起或与之相关的任何间接、偶然、特殊、后果性或惩罚性损害，或利润、数据、商誉损失，即使已被告知可能发生，我们或我们的供应商均不承担责任。\",\"legal.terms.liability.body2\":\"我们对因本条款或服务引起或与之相关的任何索赔承担的总责任，不超过以下两者中的较高者：(A) 你在索赔前十二（12）个月内为服务向我们支付的金额；或 (B) 如果你未向我们付款，则为一百美元（US$100）。\",\"legal.terms.liability.body3\":\"某些司法辖区不允许某些限制；在这些情况下，我们的责任将在法律允许的最大范围内受到限制。\",\"legal.terms.indemnity.title\":\"14. 赔偿\",\"legal.terms.indemnity.body\":\"对于因你的用户内容、你对服务的使用，或你违反本条款或法律而产生的任何第三方索赔、损害、责任和费用（包括合理律师费），你将为我们及我们的关联方、高级职员、董事、员工和代理进行抗辩并作出赔偿。\",\"legal.terms.termination.title\":\"15. 终止\",\"legal.terms.termination.body\":\"你可以随时停止使用服务。如果你实质性违反本条款，或我们必须遵守法律，或继续提供服务在商业或技术上不可行，我们可能暂停或终止访问。按其性质应在终止后继续有效的条款，将在终止后继续有效。\",\"legal.terms.governingLaw.title\":\"16. 管辖法律和争议\",\"legal.terms.governingLaw.body\":\"本条款受\u003cstrong\u003e新加坡共和国\u003c/strong\u003e法律管辖，但不包括冲突法规则。在不得放弃的强制性当地法律约束下，\u003cstrong\u003e新加坡\u003c/strong\u003e法院对因本条款或服务引起或与之相关的争议拥有非专属管辖权。你所在地的消费者保护法律可能提供额外权利或强制管辖地；在法律要求的情况下，这些法律适用。\",\"legal.terms.export.title\":\"17. 出口和制裁\",\"legal.terms.export.body\":\"你不得违反出口管制或制裁法律使用或出口服务。你声明，根据适用法律，你未被禁止接收服务。\",\"legal.terms.changes.title\":\"18. 变更\",\"legal.terms.changes.body\":\"我们可能会不时更新本条款。我们会发布更新后的条款并更新生效日期。如果变更具有重大影响，我们会按照法律要求提供额外通知。生效日期后继续使用，即表示接受更新后的条款。\",\"legal.terms.misc.title\":\"19. 其他\",\"legal.terms.misc.body\":\"本条款构成你与我们之间关于服务的完整协议，并取代关于同一事项的任何先前协议。如果某项条款不可执行，其余条款仍然有效。我们未执行某项条款不构成放弃。未经我们同意，你不得转让本条款；我们可以在合并、收购或资产出售中转让本条款。\",\"legal.terms.contact.title\":\"20. 联系\",\"common.preparing\":\"正在准备…\",\"auth.allowMicrosoftPopups\":\"请允许弹出窗口以继续使用 Microsoft 登录。\",\"auth.continueWithMicrosoft\":\"使用 Microsoft 继续\",\"auth.socialSignInFailed\":\"无法登录，请重试。\",\"auth.cnPhone.title\":\"你的手机号码是？\",\"auth.cnPhone.regionHint\":\"仅支持中国大陆手机号\",\"auth hone.purpose\":\"用于聊天语音输入、语音消息和 Audio Journal 录音笔记。用户开启语音或开始录音时申请；拒绝后不能使用相应录音功能。\",\"legal.appPermissions.android.location.description\":\"获取大致位置或精确位置\",\"legal.appPermissions.android.location.purpose\":\"连接设备位置能力并授权后，助手可查询当前位置或上次已知位置，用于基于位置的请求。\",\"legal.appPermissions.android.readCalendar.description\":\"读取系统日历与日程\",\"legal.appPermissions.android.readCalendar.purpose\":\"授权连接设备日历后，支持日程查询；同时会在日历变化、应用回到前台和后台定时任务中将日程同步到 Today 云端，不仅限于单次问答。\",\"legal.appPermissions.android.writeCalendar.description\":\"添加、修改、删除系统日历日程及提醒\",\"legal.appPermissions.android.writeCalendar.purpose\":\"助手通过日历工具创建、更新、删除日程或设置日程提醒。日历连接入口会同时申请读、写权限。\",\"legal.appPermissions.android.readContacts.description\":\"读取联系人姓名、电话、邮箱等信息\",\"legal.appPermissions.android.readContacts.purpose\":\"连接通讯录并授权后，支持联系人列表、搜索和详情查询，为助手处理联系人相关请求提供信息。\",\"legal.appPermissions.android.writeContacts.description\":\"新增、更新系统联系人\",\"legal.appPermissions.android.writeContacts.purpose\":\"用于助手创建或更新联系人。通讯录连接入口会同时申请读、写权限。\",\"legal.appPermissions.android.sms.description\":\"读取短信内容、号码、时间和类型\",\"legal.appPermissions.android.sms.purpose\":\"连接短信能力并授权后，助手可查询收件箱、已发送或全部短信列表。此权限用于读取短信，不用于发送短信，也不限于登录验证码。\",\"legal.appPermissions.android.callLog.description\":\"读取通话号码、缓存联系人名、时间、类型和时长\",\"legal.appPermissions.android.callLog.purpose\":\"连接电话能力并授权后，助手可查询最近通话记录。电话连接入口与 READ_PHONE_STATE 一并申请。\",\"legal.appPermissions.android.phoneState.description\":\"读取 SIM 状态、运营商、电话类型及移动数据开关状态\",\"legal.appPermissions.android.phoneState.purpose\":\"用于助手查询设备电话或 SIM 信息；极光推送 SDK 也声明此权限。助手的电话查询功能不读取 IMEI、IMSI 或本机号码。\",\"legal.appPermissions.android.notifications.description\":\"向用户展示应用通知\",\"legal.appPermissions.android.notifications.purpose\":\"用于 Today 消息推送、任务或设备调用提醒及录音等服务状态提示。Android 13 及以上需要通知授权。\",\"legal.appPermissions.android.notificationAccess.description\":\"读取、清除系统通知，并访问活动媒体会话\",\"legal.appPermissions.android.notificationAccess.purpose\":\"您在系统“通知使用权”中开启后，Today 会接收通知变化，并在内存中保留最近最多 200 条记录；助手可查询或清除通知，并查询或控制媒体播放。此项需要在系统设置中开启。\",\"legal.appPermissions.android.doNotDisturb.description\":\"调整系统勿扰模式\",\"legal.appPermissions.android.doNotDisturb.purpose\":\"用于助手的开启／关闭勿扰工具；需要用户已在系统设置授予“勿扰模式访问”。未授权时工具不可用。\",\"legal.appPermissions.android.usageStats.description\":\"读取应用使用统计与使用事件\",\"legal.appPermissions.android.usageStats.purpose\":\"在系统设置授权后，助手可查询屏幕使用时长、应用使用情况、最近使用时间、前台应用及使用时间线。\",\"legal.appPermissions.android.files.description\":\"访问共享存储中的文件与目录\",\"legal.appPermissions.android.files.purpose\":\"在系统设置开启“所有文件访问”后，助手可列举目录、读取文件和检索媒体文件索引，范围不限于您在选择器中选择的单个文件。当前文件工具支持读取、列举和搜索。\",\"legal.appPermissions.android.overlay.description\":\"在其他应用上方显示录音控件\",\"legal.appPermissions.android.overlay.purpose\":\"Audio Journal 开始流程可引导用户到系统设置授权，用于跨应用显示最小化录音控制。每次安装最多主动引导一次；不授权时仍可使用应用内录音控件。\",\"legal.appPermissions.android.battery.description\":\"请求系统允许应用不受部分电池优化限制\",\"legal.appPermissions.android.battery.purpose\":\"用于帮助 Today 保持后台连接与任务处理。用户点击后台活动设置中的电池选项时打开系统授权／设置页面。\",\"legal.appPermissions.android.updates.description\":\"调起系统安装器安装下载的 APK\",\"legal.appPermissions.android.updates.purpose\":\"用于应用内更新：下载新版本后，交由系统安装器处理。安装仍需系统与您的确认，可能需要开启“允许来自此来源的应用”。\",\"legal.appPermissions.android.alarms.description\":\"通过系统时钟应用设置闹钟、计时器\",\"legal.appPermissions.android.alarms.purpose\":\"助手设置闹钟或计时器时，通过系统时钟应用处理。此项不等同于精确闹钟权限。\",\"legal.appPermissions.ios.photos.description\":\"读取相册中内容\",\"legal.appPermissions.ios.photos.purpose\":\"仅访问你主动选择的照片，用于添加到聊天或交给助手处理，不会扫描或上传整个相册\",\"legal.appPermissions.ios.savePhotos.description\":\"向相册中添加内容\",\"legal.appPermissions.ios.savePhotos.purpose\":\"仅当你让助手保存截图或图片时，才向相册写入图片\",\"legal.appPermissions.ios.camera.description\":\"使用摄像头\",\"legal.appPermissions.ios.camera.purpose\":\"仅当你主动选择拍照作为聊天附件，或扫描二维码连接服务时使用相机\",\"legal.appPermissions.ios.microphone.description\":\"使用麦克风\",\"legal.appPermissions.ios.microphone.purpose\":\"录制语音笔记（Audio Journal）和语音输入\",\"legal.appPermissions.ios.calendar.description\":\"读写系统日历\",\"legal.appPermissions.ios.calendar.purpose\":\"读取日历用于回答「今天有什么安排」、生成每日简报；仅在你要求时创建或修改日程\",\"legal.appPermissions.ios.write
